<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <style>
        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            font-family: sans-serif;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider::before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>

<h1>Admin</h1>

<button id="generate">Generate</button>

<div class="toggle-wrap">
    <label class="switch">
        <input type="checkbox" id="available" checked>
        <span class="slider"></span>
    </label>
    <span id="availableLabel">Available</span>
</div>

<button id="publish">Publish</button>

<h2 id="activity"></h2>

<script src="admin-config.js"></script>

<script>

let generatedActivity = "";

const acts = [
    "No Coffee",
    "₱200",
    "Movie",
    "Museum",
    "Arcade",
    "Walk",
    "Ice Cream",
    "Bowling",
    "Picnic"
];

document.getElementById("generate").onclick = () => {

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const today = new Date();

    const activity =
        acts[Math.floor(Math.random()*acts.length)];

    generatedActivity =
        activity + " " + days[today.getDay()];

    document.getElementById("activity").textContent =
        generatedActivity;

};

document.getElementById("available").onchange = (e) => {
    document.getElementById("availableLabel").textContent =
        e.target.checked ? "Available" : "Not Available";
};

document.getElementById("publish").onclick = publish;

// Sync toggle with current published state on page load
fetch("https://turon-admin.mikeharoldhandig12.workers.dev/?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(state => {
        const toggle = document.getElementById("available");
        toggle.checked = !!state.available;
        document.getElementById("availableLabel").textContent =
            toggle.checked ? "Available" : "Not Available";
        if (state.activity) {
            generatedActivity = state.activity;
            document.getElementById("activity").textContent = state.activity;
        }
    })
    .catch(err => console.error("Failed to load current state:", err));

async function publish() {

    const available = document.getElementById("available").checked;

    if (available && !generatedActivity) {
        alert("Generate first.");
        return;
    }

    try {

        const response = await fetch("https://turon-admin.mikeharoldhandig12.workers.dev/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                available: available,
                activity: generatedActivity
            })
        });

        const text = await response.text();

        console.log(text);

        if (response.ok) {
            alert("Published!");
        } else {
            alert("Publish failed.");
        }

    } catch (err) {
        console.error(err);
        alert(err.message);
    }
}

</script>

</body>
</html>
